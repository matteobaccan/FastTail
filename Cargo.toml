[package]
name = "fasttail"
version = "0.13.0"
edition = "2021"
authors = ["Matteo Baccan"]
description = "Ultra-fast multi-stream log monitor and tail viewer with Cyberpunk UI aesthetic"
license = "MIT"
repository = "https://github.com/matteobaccan/FastTail"
homepage = "https://github.com/matteobaccan/FastTail"
readme = "README.md"
documentation = "https://github.com/matteobaccan/FastTail#readme"
keywords = ["log", "tail", "logging", "monitoring", "gui"]
categories = ["command-line-utilities", "gui", "development-tools::debugging"]
# The oldest toolchain the dependencies build on (sevenz-rust2 0.23 needs 1.93); CI
# builds on stable.
rust-version = "1.93"
# The published crate carries the code, the licence and the docs a user reads from
# `cargo install`; everything else in the repository (the spec workspace, the agent
# skills, the screenshots, the release scaffolding) is repository furniture.
exclude = [
    ".claude/**",
    ".jules/**",
    ".Jules/**",
    ".github/**",
    "openspec/**",
    "dist/**",
    # The README renders on crates.io with its images resolved against the repository,
    # so the artwork does not need to travel in the crate.
    "assets/**",
    "fasttail.ini",
    "renovate.json",
]

[dependencies]
# UI Framework & Docking
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland", "links"] }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
egui_commonmark = "0.25"
memchr = "2"

# File I/O & Streaming
notify = "9.0.0-rc.5"
# Compressed logs: gzip through the pure-Rust miniz_oxide backend, zip entries (stored
# or deflate) inflated through that same flate2. zip's own `deflate` feature would add
# the zopfli compressor and the zlib-rs backend, neither needed to read.
flate2 = "1.1"
zip = { version = "8.0", default-features = false, features = ["deflate-flate2"] }
# Tar archives, plain or compressed: the reader walks headers (GNU long names, pax,
# base-256 sizes); `xattr` (the only default feature) is for unpacking to disk, which
# FastTail never does.
tar = { version = "0.4", default-features = false }
# bzip2 on its default backend, libbz2-rs-sys, a pure-Rust port of libbzip2: no C
# toolchain on any release target (the C `bzip2-sys` feature stays off).
bzip2 = "0.6"
# xz through a pure-Rust LZMA2 decoder; the encoder is a dev-dependency feature only
# (test fixtures), and the lzip reader is not needed.
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz", "optimization"] }
# zstd through a pure-Rust decoder (the C libzstd would need a cross compiler for
# Linux ARM64); decompression is bounded by the spool's disk writes, not the codec.
ruzstd = "0.9"
# 7z archives: a pure-Rust reader sharing lzma-rust2 with the xz reader. Only the coders
# FastTail opens are on (bzip2, deflate, PPMd; LZMA / LZMA2 / BCJ / delta are built in);
# no AES (encrypted entries are refused, never decrypted), no writer, no zstd / brotli /
# lz4. `deflate` brings flate2's pure-Rust zlib-rs backend.
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "deflate", "ppmd"] }

# Data, Serialization & Parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"
toml = "1.0"
rust-ini = "0.21"
regex = "1.11"
smallvec = "1.13"
rfd = "0.17"

# Telemetry
sysinfo = "0.39"
similar = "3"

# Windows Specific
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[features]
default = []
audio = ["dep:rodio"]

[dependencies.rodio]
version = "0.22"
optional = true

[dev-dependencies]
tempfile = "3.17"
# xz fixtures built inside the tests.
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz", "encoder"] }
# 7z fixtures built inside the tests (the writer, and bzip2 blocks).
sevenz-rust2 = { version = "0.23", default-features = false, features = ["compress", "bzip2"] }

# On-demand engine benchmark: built only by `cargo bench` (release-derived
# `bench` profile), never by `cargo test`. See benches/filter_bench.rs.
[[bench]]
name = "filter_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1

# Development and test builds: file and line numbers in backtraces, no full debug info.
# Less to write and link on every change; dependencies carry none at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
