; A sample FastTail log format. Copy it into the `formats` folder next to fasttail.ini
; (one format per *.fasttail-format.ini file) and restart FastTail.
[format]
name = Payments
; Regexes with named groups, tried in order (regex, regex.2 ... regex.8).
regex = ^(?P<ts>\d\d\.\d\d\.\d\d \d\d:\d\d:\d\d,\d{3}) \[(?P<thread>[^\]]+)\] (?P<level>[A-Z]) (?P<msg>.*)$
; The field holding the time and how to read it (a strftime subset, or epoch_s / epoch_ms);
; without timestamp_format the usual timestamp detection reads the field.
timestamp_field = ts
timestamp_format = %d.%m.%y %H:%M:%S,%3f
; The field holding the level, and the log's own level words.
level_field = level
level_map = W=warn,E=error,I=info,D=debug
message_field = msg
; File names the format is for: they get it before any other format.
files = payments-*.log; payments.log
; The columns of the column view.
columns = ts,thread,level
; Sample lines (sample.1 ... sample.20): the timestamp format must read one of them.
sample.1 = 28.09.26 14:02:11,123 [main] E card declined
sample.2 = 28.09.26 14:02:12,500 [pool-1] I card accepted
