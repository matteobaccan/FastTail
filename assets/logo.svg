<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#05080C" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>

    <!-- Neon Pink/Amber Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.07" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="240" rx="16" fill="url(#bgGrad)" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.3" />
  <rect width="800" height="240" rx="16" fill="url(#grid)" />

  <!-- Corner Tech Accents -->
  <path d="M 20 45 L 20 20 L 45 20" fill="none" stroke="#00E5FF" stroke-width="2.5" filter="url(#cyanGlow)" />
  <path d="M 780 45 L 780 20 L 755 20" fill="none" stroke="#00E5FF" stroke-width="2.5" filter="url(#cyanGlow)" />
  <path d="M 20 195 L 20 220 L 45 220" fill="none" stroke="#00E5FF" stroke-width="2.5" filter="url(#cyanGlow)" />
  <path d="M 780 195 L 780 220 L 755 220" fill="none" stroke="#00E5FF" stroke-width="2.5" filter="url(#cyanGlow)" />

  <!-- Left Icon / Emblem: Speed Bolt + Tail Stream -->
  <g transform="translate(60, 40)">
    <!-- Outer Hex Shield -->
    <polygon points="70,10 130,45 130,115 70,150 10,115 10,45" fill="#0A111E" stroke="#00E5FF" stroke-width="2" filter="url(#cyanGlow)" />
    <!-- Inner Stream Lines -->
    <path d="M 25 60 L 50 60" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 20 80 L 55 80" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 25 100 L 45 100" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    
    <!-- Lightning Bolt (Fast) -->
    <polygon points="75,25 45,85 70,85 55,135 105,70 80,70" fill="url(#accentGrad)" filter="url(#pinkGlow)" />
  </g>

  <!-- Brand Typography -->
  <!-- "FASTTAIL" Title -->
  <text x="230" y="115" font-family="'Consolas', 'JetBrains Mono', 'Segoe UI', monospace" font-size="64" font-weight="900" letter-spacing="4" fill="url(#cyanGrad)" filter="url(#cyanGlow)">FAST<tspan fill="#FFFFFF">TAIL</tspan></text>

  <!-- Terminal Prompt Symbol & Subtitle -->
  <g transform="translate(232, 148)">
    <text font-family="'Consolas', 'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#00E5FF">&gt; </text>
    <text x="20" font-family="'Consolas', 'JetBrains Mono', 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#88A0C0">HIGH-PERFORMANCE REAL-TIME LOG MONITOR</text>
  </g>

  <!-- Tagline / Features bar: kept short of x=620 so the signature below stays clear -->
  <g transform="translate(232, 185)">
    <!-- Pill 1: RUST · GPU -->
    <rect x="0" y="0" width="80" height="22" rx="4" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-width="1" />
    <text x="40" y="15" text-anchor="middle" font-family="'Consolas', monospace" font-size="10" font-weight="bold" fill="#00E5FF">RUST · GPU</text>

    <!-- Pill 2: ZERO-LAG ENGINE -->
    <rect x="90" y="0" width="108" height="22" rx="4" fill="#FF007F" fill-opacity="0.12" stroke="#FF007F" stroke-width="1" />
    <text x="144" y="15" text-anchor="middle" font-family="'Consolas', monospace" font-size="10" font-weight="bold" fill="#FF007F">ZERO-LAG ENGINE</text>

    <!-- Pill 3: REGEX FILTERS -->
    <rect x="208" y="0" width="96" height="22" rx="4" fill="#FFD700" fill-opacity="0.12" stroke="#FFD700" stroke-width="1" />
    <text x="256" y="15" text-anchor="middle" font-family="'Consolas', monospace" font-size="10" font-weight="bold" fill="#FFD700">REGEX FILTERS</text>

    <!-- Pill 4: TIME RANGE -->
    <rect x="314" y="0" width="80" height="22" rx="4" fill="#00FF88" fill-opacity="0.12" stroke="#00FF88" stroke-width="1" />
    <text x="354" y="15" text-anchor="middle" font-family="'Consolas', monospace" font-size="10" font-weight="bold" fill="#00FF88">TIME RANGE</text>
  </g>

  <!-- Author Signature -->
  <text x="760" y="215" text-anchor="end" font-family="'Consolas', monospace" font-size="11" fill="#4B6584" letter-spacing="1">BY MATTEO BACCAN</text>
</svg>
