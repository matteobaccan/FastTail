# Publishes the product site in site/ to GitHub Pages.
# Repository setting: Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/assets/screenshots
          cp -r site/. _site/
          cp assets/logo.svg assets/icon.svg assets/social-preview.png _site/assets/
          cp assets/screenshots/*.png _site/assets/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
