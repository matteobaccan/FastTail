name: Build and Test FastTail

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # Any base branch: stacked pull requests (feature on top of feature) get the
  # same tests as those targeting main.
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege by default: every job only reads the repository. The release job
# raises this to `contents: write` for itself, which is the only write we need.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Tests: run on every push, pull request, tag and manual dispatch.
  # Linux also enforces formatting. Windows is included because the code has
  # platform-specific branches (config path, audio, BareTail bridge).
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - name: 🪟 Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@v7

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: 🎨 Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: 📜 Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: ⬇️ Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev

      # Compile first so the timeout below measures the tests alone: a cold
      # build can take several minutes, the suite itself well under one.
      - name: 🔨 Build test binaries
        run: cargo test --no-run --target ${{ matrix.target }}

      # Lints on both systems: part of the code (DPI, clipboard, the BareTail bridge)
      # is compiled on Windows only.
      - name: 📎 Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      # The terminal-only build (openspec/changes/tui-interface): it must compile and lint
      # on its own, and no GUI crate may creep into it.
      - name: 🖥️ Terminal-only build
        shell: bash
        run: |
          cargo clippy --no-default-features --features tui --lib --bin fasttail-tui --target ${{ matrix.target }} -- -D warnings
          gui=$(cargo tree --no-default-features --features tui -e normal --prefix none --target ${{ matrix.target }} | grep -E '^(egui|eframe|egui_dock|egui_commonmark|wgpu|winit|glow|rfd) ' || true)
          if [ -n "$gui" ]; then
            echo "GUI crates in the terminal-only build:"
            echo "$gui"
            exit 1
          fi

      # A hung test fails the job in minutes instead of holding the runner for hours.
      - name: 🧪 Run test suite
        timeout-minutes: 5
        run: cargo test --target ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # Release binaries: only for version tags and manual runs. No tests here;
  # the `test` job runs in parallel and gates the release.
  # Binaries keep debug info (Cargo profile `debug = 1`) so crash logs carry
  # file:line frames; the size problem is solved by compressing the assets.
  # ---------------------------------------------------------------------------
  build:
    name: 🛠️ Build (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - name: 🪟 Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: fasttail-windows-x86_64
            ext: zip
            binary: fasttail.exe
            tui_binary: fasttail-tui.exe

          # Windows ARM64 is not built: Windows on ARM runs the x86_64 exe
          # under emulation and the cross-compiled target had no users.

          # Linux
          # Ubuntu 22.04 runners: the binaries need glibc 2.35 at most (Ubuntu 22.04+,
          # Debian 12+, Fedora 36+), checked below; the packages inherit the floor.
          - name: 🐧 Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: fasttail-linux-x86_64
            ext: tar.gz
            binary: fasttail
            tui_binary: fasttail-tui
            tui_only_asset: fasttail-tui-linux-x86_64

          - name: 🐧 Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: fasttail-linux-arm64
            ext: tar.gz
            binary: fasttail
            tui_binary: fasttail-tui
            tui_only_asset: fasttail-tui-linux-arm64

          # macOS
          # Temporarily disabled: macOS x86_64 (Intel) build
          # - name: macOS x86_64 (Intel)
          #   os: macos-13
          #   target: x86_64-apple-darwin
          #   asset: fasttail-macos-x86_64
          #   ext: tar.gz
          #   binary: fasttail

          - name: 🍎 macOS ARM64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            asset: fasttail-macos-arm64
            ext: tar.gz
            binary: fasttail
            tui_binary: fasttail-tui

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Release builds never run on `main` pushes, so the release-profile cache
      # is written by manual runs on `main` and read by tag runs.
      - name: 📜 Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      - name: ⬇️ Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: 🛠️ Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # The newest glibc symbol the executables need sets the oldest distribution they
      # run on; both must also start (`--version` opens no window).
      - name: 🔎 glibc floor and start (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          for bin in "${{ matrix.binary }}" "${{ matrix.tui_binary }}"; do
            need=$(objdump -T "$out/$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)
            echo "$bin needs glibc $need"
            if [ "$(printf '%s\n' "$need" 2.35 | sort -V | tail -n 1)" != "2.35" ]; then
              echo "::error::$bin needs glibc $need, above the 2.35 floor"; exit 1
            fi
            "$out/$bin" --version
          done

      # Asset names carry the version (fasttail-linux-x86_64-0.10.1.tar.gz), read from
      # Cargo.toml; on a tag run it must match the tag.
      # Linux/macOS: tar.gz, Windows: zip, each with the two executables (the window
      # and the terminal interface, `fasttail-tui`, both from the default features),
      # LICENSE and README.md. Windows also gets a separate -symbols zip with the PDB (unpacked next
      # to the exe, it lets crash backtraces resolve function names).
      - name: 📦 Package release asset
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::No version in Cargo.toml"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"; exit 1
          fi
          asset="${{ matrix.asset }}-$version.${{ matrix.ext }}"
          out="target/${{ matrix.target }}/release"
          mkdir -p stage dist
          cp "$out/${{ matrix.binary }}" "$out/${{ matrix.tui_binary }}" LICENSE README.md stage/
          case "${{ matrix.ext }}" in
            tar.gz)
              tar -C stage -czf "dist/$asset" "${{ matrix.binary }}" "${{ matrix.tui_binary }}" LICENSE README.md
              ;;
            zip)
              # The executable (with LICENSE and README.md) is what people download and
              # what the Windows package managers point at. The 53 MB of debug symbols,
              # which made the download 24 MB for everyone, travel in their own asset.
              (cd stage && 7z a -tzip "../dist/$asset" fasttail.exe fasttail-tui.exe LICENSE README.md)
              # Cargo names the terminal executable's PDB fasttail_tui.pdb (the crate
              # name, `-` as `_`); both PDBs go in the symbols archive.
              cp "$out"/*.pdb stage/
              (cd stage && 7z a -tzip "../dist/${{ matrix.asset }}-symbols-$version.zip" ./*.pdb)
              ;;
          esac
          ls -la dist

      # Linux: a terminal-only archive for servers without a desktop, built again without
      # the GUI features so the binary provably links no GUI crate (the default build's
      # `fasttail-tui` would, on ELF, keep more of them than the MSVC linker does).
      - name: 🖥️ Terminal-only archive (Linux)
        if: matrix.tui_only_asset != ''
        shell: bash
        run: |
          set -euo pipefail
          gui=$(cargo tree --no-default-features --features tui -e normal --prefix none --target ${{ matrix.target }} | grep -E '^(egui|eframe|egui_dock|egui_commonmark|wgpu|winit|glow|rfd) ' || true)
          if [ -n "$gui" ]; then
            echo "::error::GUI crates in the terminal-only build: $gui"; exit 1
          fi
          cargo build --release --no-default-features --features tui --bin fasttail-tui --target ${{ matrix.target }} --target-dir target-tui
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          mkdir -p stage-tui stage-tui-symbols
          cp "target-tui/${{ matrix.target }}/release/fasttail-tui" LICENSE README.md stage-tui/
          # The debug info goes in its own archive, as the Windows PDBs do: unpacked next
          # to the executable (`fasttail-tui.debug`, found through its debug link), it gives
          # crash backtraces their files and lines; the download stays small.
          (cd stage-tui             && objcopy --only-keep-debug fasttail-tui fasttail-tui.debug             && objcopy --strip-debug --add-gnu-debuglink=fasttail-tui.debug fasttail-tui             && mv fasttail-tui.debug ../stage-tui-symbols/)
          tar -C stage-tui -czf "dist/${{ matrix.tui_only_asset }}-$version.tar.gz" fasttail-tui LICENSE README.md
          tar -C stage-tui-symbols -czf "dist/${{ matrix.tui_only_asset }}-symbols-$version.tar.gz" fasttail-tui.debug

      # Sizes of the executables and the archives, for the budget in
      # openspec/changes/tui-interface/design.md (compared with the previous release).
      - name: 📏 Sizes
        shell: bash
        run: |
          {
            echo "### Sizes (${{ matrix.name }})"
            echo
            echo "| File | Bytes |"
            echo "|---|---|"
            for f in "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
                     "target/${{ matrix.target }}/release/${{ matrix.tui_binary }}" \
                     stage-tui/fasttail-tui dist/*; do
              [ -f "$f" ] && echo "| $(basename "$f") | $(wc -c < "$f" | tr -d ' ') |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Windows installer from the binaries just archived. A second MSI of the same
      # package with a lower version (0.0.1) stands for the previous release in the upgrade
      # test, so the first release that ships an MSI is tested the same way.
      - name: 📦 Windows installer (MSI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          $bin = "target/${{ matrix.target }}/release"
          # wix's messages become annotations, readable without the raw log.
          function Wix($v, $out) {
            $log = wix build packaging/windows/fasttail.wxs -arch x64 -d Version=$v -d BinDir=$bin -o $out 2>&1
            $log | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) {
              $log | Where-Object { "$_" -match 'error|warning' } | ForEach-Object { Write-Host "::error::$_" }
              throw "wix build failed"
            }
          }
          Wix $version "dist/${{ matrix.asset }}-$version.msi"
          New-Item -ItemType Directory -Force upgrade-test | Out-Null
          Wix '0.0.1' upgrade-test/fasttail-0.0.1.msi
          Get-ChildItem dist

      # Install the older MSI, upgrade to the new one, check what a user gets (files, the
      # Start menu shortcut, the user PATH seen by a new shell, one "Installed apps" entry
      # with the new version), then remove it and check that nothing is left.
      - name: 🧪 Install test (MSI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap { Write-Host "::error::$_"; break }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          $msi = (Resolve-Path "dist/${{ matrix.asset }}-$version.msi").Path
          $old = (Resolve-Path upgrade-test/fasttail-0.0.1.msi).Path
          function Msi($argv) {
            $p = Start-Process msiexec.exe -ArgumentList $argv -Wait -PassThru
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              $log = $argv[-1]
              if (Test-Path $log) {
                Get-Content $log | Select-String -Pattern 'error|Return value 3' | Select-Object -Last 15 |
                  ForEach-Object { Write-Host "::error::$_" }
              }
              throw "msiexec $argv exited $($p.ExitCode)"
            }
          }
          function Run($exe) {
            $p = Start-Process $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "$exe --version exited $($p.ExitCode)" }
          }
          function Entries {
            @(Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
              Get-ItemProperty | Where-Object { $_.DisplayName -eq 'FastTail' })
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\FastTail'
          Msi @('/i', $old, '/qn', '/l*v', 'msi-old.log')
          Msi @('/i', $msi, '/qn', '/l*v', 'msi-new.log')
          Run (Join-Path $dir 'fasttail.exe')
          Run (Join-Path $dir 'fasttail-tui.exe')
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\FastTail.lnk'
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut" }
          $entries = Entries
          if ($entries.Count -ne 1) { throw "$($entries.Count) Installed apps entries after the upgrade" }
          if ($entries[0].DisplayVersion -ne $version) { throw "Installed apps shows $($entries[0].DisplayVersion)" }
          # A new shell reads the user PATH the installer wrote.
          pwsh -NoProfile -Command "`$env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User'); `$p = Start-Process fasttail-tui -ArgumentList '--version' -Wait -PassThru -NoNewWindow; exit `$p.ExitCode"
          if ($LASTEXITCODE -ne 0) { throw "fasttail-tui not found on the user PATH" }
          Msi @('/x', $msi, '/qn', '/l*v', 'msi-remove.log')
          if (Test-Path $dir) { throw "$dir left after removal" }
          if (Test-Path $lnk) { throw "shortcut left after removal" }
          if ((Entries).Count -ne 0) { throw "Installed apps entry left after removal" }
          if (([Environment]::GetEnvironmentVariable('Path','User') ?? '') -like "*$dir*") { throw "PATH entry left after removal" }

      # Linux packages from the binaries just archived (nothing is compiled again), with
      # the debug info stripped (the archives keep it for crash logs; installed, it would
      # weigh 190 MB). Each is installed, run and removed before it may be uploaded: the
      # .deb with apt on the runner, the .rpm with dnf in a Fedora container, the
      # AppImage extracted (no FUSE).
      - name: 📦 Linux packages (deb, rpm, AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          case "${{ matrix.target }}" in
            x86_64-*) appimage_arch=x86_64 ;;
            aarch64-*) appimage_arch=aarch64 ;;
          esac
          strip "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
                "target/${{ matrix.target }}/release/${{ matrix.tui_binary }}"
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output dist/
          cargo generate-rpm --target ${{ matrix.target }} --output dist/
          packaging/linux/appimage.sh "target/${{ matrix.target }}/release" "$appimage_arch" \
            "dist/${{ matrix.asset }}-$version.AppImage"
          ls -la dist

      - name: 🧪 Install test (deb, rpm, AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/fasttail_*.deb
          fasttail --version
          fasttail-tui --version
          test -f /usr/share/applications/fasttail.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/fasttail.png
          sudo apt-get remove -y fasttail
          test ! -e /usr/bin/fasttail
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -euc '
            dnf install -y --setopt=install_weak_deps=False /dist/fasttail-*.rpm
            fasttail --version
            fasttail-tui --version
            dnf remove -y fasttail
            test ! -e /usr/bin/fasttail'
          appimage=$(ls dist/*.AppImage)
          chmod +x "$appimage"
          "$appimage" --appimage-extract-and-run --version

      - name: ⬆️ Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          # `dist/*` rather than the single asset: the Windows build also produces the
          # symbols archive, and the release job flattens whatever arrives.
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: tags only, after tests and every build succeeded.
  # ---------------------------------------------------------------------------
  release:
    name: 🚀 Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v7

      # The release body is the CHANGELOG.md section whose heading matches the
      # tag (v0.3.0 -> "## [0.3.0]"). generate_release_notes then appends the
      # merged pull requests, new contributors and the compare link.
      - name: 📝 Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; found = index($0, "## [" ver "]") == 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $version, the release body will only contain the generated notes"
          fi
          echo "--- release-notes.md ---"; cat release-notes.md

      - name: ⬇️ Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: 📁 Flatten release artifacts
        shell: bash
        run: |
          mkdir -p final-release
          find release-artifacts -type f -exec cp {} final-release/ \;
          ls -la final-release

      # A downloads grid (architecture x system, one link per asset found) goes above the
      # CHANGELOG section, as RustDesk and other multi-platform projects do.
      - name: 🧮 Downloads grid
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/downloads_table.py final-release "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > downloads.md
          { cat downloads.md; echo "## What's new"; cat release-notes.md; } > release-body.md
          echo "--- release-body.md ---"; cat release-body.md

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: final-release/*
          body_path: release-body.md
          generate_release_notes: true
