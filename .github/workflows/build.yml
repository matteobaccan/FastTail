name: Build and Test FastTail

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # Any base branch: stacked pull requests (feature on top of feature) get the
  # same tests as those targeting main.
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege by default: every job only reads the repository. The release job
# raises this to `contents: write` for itself, which is the only write we need.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Tests: run on every push, pull request, tag and manual dispatch.
  # Linux also enforces formatting. Windows is included because the code has
  # platform-specific branches (config path, audio, BareTail bridge).
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - name: 🪟 Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@v7

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: 🎨 Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: 📜 Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: ⬇️ Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: 🧪 Run test suite
        run: cargo test --target ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # Release binaries: only for version tags and manual runs. No tests here;
  # the `test` job runs in parallel and gates the release.
  # Binaries keep debug info (Cargo profile `debug = 1`) so crash logs carry
  # file:line frames; the size problem is solved by compressing the assets.
  # ---------------------------------------------------------------------------
  build:
    name: 🛠️ Build (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - name: 🪟 Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: fasttail-windows-x86_64.zip
            binary: fasttail.exe

          # Windows ARM64 is not built: Windows on ARM runs the x86_64 exe
          # under emulation and the cross-compiled target had no users.

          # Linux
          - name: 🐧 Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: fasttail-linux-x86_64.tar.gz
            binary: fasttail

          - name: 🐧 Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: fasttail-linux-arm64.tar.gz
            binary: fasttail

          # macOS
          # Temporarily disabled: macOS x86_64 (Intel) build
          # - name: macOS x86_64 (Intel)
          #   os: macos-13
          #   target: x86_64-apple-darwin
          #   asset: fasttail-macos-x86_64.tar.gz
          #   binary: fasttail

          - name: 🍎 macOS ARM64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            asset: fasttail-macos-arm64.tar.gz
            binary: fasttail

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Release builds never run on `main` pushes, so the release-profile cache
      # is written by manual runs on `main` and read by tag runs.
      - name: 📜 Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      - name: ⬇️ Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: 🛠️ Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Linux/macOS: tar.gz with the executable.
      # Windows: zip with the executable, plus a separate -symbols.zip with the PDB
      # (unpacked next to the exe, it lets crash backtraces resolve function names).
      - name: 📦 Package release asset
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          mkdir -p stage dist
          cp "$out/${{ matrix.binary }}" stage/
          case "${{ matrix.asset }}" in
            *.tar.gz)
              tar -C stage -czf "dist/${{ matrix.asset }}" "${{ matrix.binary }}"
              ;;
            *.zip)
              # The executable alone: this is what people download and what the Windows
              # package managers point at. The 53 MB of debug symbols, which made the
              # download 24 MB for everyone, travel in their own asset.
              7z a -tzip "dist/${{ matrix.asset }}" ./stage/fasttail.exe
              cp "$out/fasttail.pdb" stage/
              7z a -tzip "dist/fasttail-windows-x86_64-symbols.zip" ./stage/fasttail.pdb
              ;;
          esac
          ls -la dist

      - name: ⬆️ Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          # `dist/*` rather than the single asset: the Windows build also produces the
          # symbols archive, and the release job flattens whatever arrives.
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: tags only, after tests and every build succeeded.
  # ---------------------------------------------------------------------------
  release:
    name: 🚀 Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v7

      # The release body is the CHANGELOG.md section whose heading matches the
      # tag (v0.3.0 -> "## [0.3.0]"). generate_release_notes then appends the
      # merged pull requests, new contributors and the compare link.
      - name: 📝 Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; found = index($0, "## [" ver "]") == 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $version, the release body will only contain the generated notes"
          fi
          echo "--- release-notes.md ---"; cat release-notes.md

      - name: ⬇️ Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: 📁 Flatten release artifacts
        shell: bash
        run: |
          mkdir -p final-release
          find release-artifacts -type f -exec cp {} final-release/ \;
          ls -la final-release

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: final-release/*
          body_path: release-notes.md
          generate_release_notes: true
